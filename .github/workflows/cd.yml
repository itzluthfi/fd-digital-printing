name: CD

# Deploy otomatis ke VPS setiap push ke main.
# Job ini skip halus sampai 3 secret di bawah diisi di
# GitHub → Settings → Secrets and variables → Actions.
# Lihat README bagian "CI/CD" untuk cara setup VPS.
#
# Catatan: GitHub menolak `secrets` di `if:` level job, jadi secret
# dipetakan dulu ke `env:` lalu step di-gate pakai `env.`.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Deploy via SSH
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ACTOR,BRANCH,REPO,COMMIT_SHA
          script: |
            set -e
            cd /opt/fd-digital-printing

            # 1. Catat commit aktif saat ini untuk pengamanan rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Commit sebelum update: $PREV_COMMIT"

            # 2. Backup database atomic (VACUUM INTO) sebelum update
            bun run db:backup || cp data/app.db "/backup/fd/app-fallback-$(date +%F-%H%M).db" || true

            # 3. Pull kode terbaru & bangun aplikasi
            git config --global --add safe.directory /opt/fd-digital-printing || true
            git pull origin "$BRANCH"
            NEW_COMMIT=$(git rev-parse --short HEAD)
            COMMIT_MSG=$(git log -1 --pretty=format:'%s')

            bun install --frozen-lockfile
            bun run db:push
            bun run build

            # 4. Restart service
            sudo systemctl restart fd-printing

            # 5. Deteksi port aplikasi dari .env (default 3000)
            APP_PORT=$(grep -E '^PORT=' .env 2>/dev/null | cut -d '=' -f2 | tr -d ' "' || echo "")
            APP_PORT=${APP_PORT:-3000}
            echo "Memverifikasi healthcheck di port $APP_PORT..."

            # 6. Polling HTTP Healthcheck (hingga 15 detik)
            HEALTHY=0
            for i in {1..15}; do
              if curl -s -f "http://127.0.0.1:${APP_PORT}/api/health" > /dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 1
            done

            # 7. Penanganan status & Auto-Rollback
            if [ "$HEALTHY" -eq 1 ]; then
              echo "✅ DEPLOY OK: Server sehat & responsif di port $APP_PORT."
              bun run deploy:notify \
                --status=success \
                --actor="$ACTOR" \
                --branch="$BRANCH" \
                --repo="$REPO" \
                --sha="$NEW_COMMIT" \
                --commit="$NEW_COMMIT - $COMMIT_MSG" \
                --port="$APP_PORT" || true
            else
              echo "❌ DEPLOY GAGAL: Healthcheck tidak merespons di port $APP_PORT! Memulai auto-rollback..."
              SERVICE_LOGS=$(sudo journalctl -u fd-printing -n 12 --no-pager 2>/dev/null || echo "Log tidak tersedia")
              bun run deploy:notify \
                --status=failed \
                --actor="$ACTOR" \
                --branch="$BRANCH" \
                --repo="$REPO" \
                --sha="$NEW_COMMIT" \
                --prev="$PREV_COMMIT" \
                --commit="$NEW_COMMIT - $COMMIT_MSG" \
                --error="Healthcheck tidak merespons (HTTP timeout 15 detik) di port $APP_PORT" \
                --log="$SERVICE_LOGS" \
                --rollback=true || true

              # Auto-Rollback ke commit sebelumnya
              git checkout "$PREV_COMMIT"
              bun install --frozen-lockfile
              bun run build
              sudo systemctl restart fd-printing
              echo "⚠️ Telah di-rollback ke commit sebelumnya: $PREV_COMMIT"
              exit 1
            fi

      - name: Deploy dilewati (secret belum diisi)
        if: ${{ env.SSH_HOST == '' }}
        run: echo "SSH_HOST belum diisi di GitHub Secrets — deploy dilewati. Lihat README bagian CI/CD."
