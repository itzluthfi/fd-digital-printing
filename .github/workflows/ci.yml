name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    # Secret dummy khusus build-time. Secret asli dipakai di server/VPS,
    # bukan di CI. Tanpa ini Better Auth menolak di-import saat build.
    env:
      BETTER_AUTH_SECRET: ci-only-dummy-secret
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
      TELEGRAM_DEV_TOPIC_ID: ${{ secrets.TELEGRAM_DEV_TOPIC_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Notifikasi Telegram jika CI Gagal
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_DEV_CHAT_ID" ]; then
            echo "ℹ️ TELEGRAM_BOT_TOKEN atau TELEGRAM_DEV_CHAT_ID belum diset di GitHub Secrets. Notifikasi dilewati."
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' || echo "No commit message")
          SHORT_SHA=$(git rev-parse --short HEAD || echo "")

          MESSAGE="🚨 <b>CI PIPELINE GAGAL!</b>%0A%0A"
          MESSAGE="${MESSAGE}👤 <b>Pemicu:</b> @${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A"
          MESSAGE="${MESSAGE}🏷️ <b>Commit:</b> <code>${SHORT_SHA} - ${COMMIT_MSG}</code>%0A"
          MESSAGE="${MESSAGE}📦 <b>Repo:</b> <code>${{ github.repository }}</code>%0A%0A"
          MESSAGE="${MESSAGE}⚠️ <i>Type-check (bun run check) atau Build (bun run build) mengalami error.</i>%0A"
          MESSAGE="${MESSAGE}👉 <a href=\"${RUN_URL}\">Lihat Detail Error di GitHub Actions</a>"

          TOPIC_PARAM=""
          if [ -n "$TELEGRAM_DEV_TOPIC_ID" ]; then
            TOPIC_PARAM="-d message_thread_id=${TELEGRAM_DEV_TOPIC_ID}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_DEV_CHAT_ID}" \
            $TOPIC_PARAM \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview="true" || true
