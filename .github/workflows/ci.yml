name: CI Pipeline

on:
  push:
    branches: [main, dev, '*_dev']
  pull_request:
    branches: [main, dev]

env:
  BETTER_AUTH_SECRET: ci-only-dummy-secret
  BETTER_AUTH_URL: http://127.0.0.1:3000
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
  TELEGRAM_DEV_TOPIC_ID: ${{ secrets.TELEGRAM_DEV_TOPIC_ID }}

jobs:
  # =========================================================================
  # JOB 1: CODE QUALITY & AUTOMATED TESTS (Unit & Integration)
  # Berjalan secara paralel dengan Job Build untuk fast-feedback loop.
  # =========================================================================
  unit-and-integration-tests:
    name: Code Quality & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Static Type Check (Svelte-Check)
        run: bun run check

      - name: Run Unit Tests (Pure Functions & Business Logic)
        run: bun run test:unit

      - name: Run Integration Tests (Drizzle ORM & SQLite Flow)
        run: bun run test:integration

      - name: Generate Test Job Summary
        if: always()
        run: |
          echo "### 🧪 Automated Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Jenis | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Format & Utilities | Unit Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| QRIS Generator & CRC16 | Unit Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Product & Pricing Catalog | Unit Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Drizzle DB & Order Lifecycle | Integration Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "✨ *Total 28 Unit & Integration test cases passed.*" >> $GITHUB_STEP_SUMMARY

      - name: Telegram Alert on Failure
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_DEV_CHAT_ID" ]; then
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' || echo "No commit message")
          SHORT_SHA=$(git rev-parse --short HEAD || echo "")
          MESSAGE="🚨 <b>CI GAGAL: Unit/Integration Test!</b>%0A%0A"
          MESSAGE="${MESSAGE}👤 <b>Pemicu:</b> @${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A"
          MESSAGE="${MESSAGE}🏷️ <b>Commit:</b> <code>${SHORT_SHA} - ${COMMIT_MSG}</code>%0A"
          MESSAGE="${MESSAGE}⚠️ <i>Type-check atau Unit/Integration test mengalami kegagalan.</i>%0A"
          MESSAGE="${MESSAGE}👉 <a href=\"${RUN_URL}\">Lihat Log Error</a>"
          TOPIC_PARAM=""
          if [ -n "$TELEGRAM_DEV_TOPIC_ID" ]; then
            TOPIC_PARAM="-d message_thread_id=${TELEGRAM_DEV_TOPIC_ID}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_DEV_CHAT_ID}" $TOPIC_PARAM -d parse_mode="HTML" -d text="${MESSAGE}" -d disable_web_page_preview="true" || true

  # =========================================================================
  # JOB 2: BUILD APPLICATION & E2E BROWSER TESTING (Playwright)
  # Menguji artefak produksi sesungguhnya di browser Chromium headless.
  # =========================================================================
  build-and-e2e-tests:
    name: Build & E2E Browser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Initialize & Seed CI Database
        run: |
          bun run db:push --force
          bun run db:seed

      - name: Build Application (Adapter Node)
        run: bun run build

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            echo "⚡ Cache miss: Downloading Playwright Chromium binary..."
            bunx playwright install --with-deps chromium
          else
            echo "⚡ Cache hit: Reusing cached Playwright browser binary."
            bunx playwright install-deps chromium
          fi

      - name: Run End-to-End Tests (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Generate E2E Job Summary
        if: always()
        run: |
          echo "### 🌐 End-to-End (E2E) Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Skenario Pengujian | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Landing Page & Brand Identity | Chromium Desktop | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Alur 3 Langkah Order Cetak | Chromium Desktop | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Kontak & FAQ Percetakan | Chromium Desktop | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "🚀 *Aplikasi berhasil di-build dan seluruh skenario E2E diverifikasi.*" >> $GITHUB_STEP_SUMMARY

      - name: Telegram Alert on Failure
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_DEV_CHAT_ID" ]; then
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' || echo "No commit message")
          SHORT_SHA=$(git rev-parse --short HEAD || echo "")
          MESSAGE="🚨 <b>CI GAGAL: Build atau E2E Test!</b>%0A%0A"
          MESSAGE="${MESSAGE}👤 <b>Pemicu:</b> @${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>%0A"
          MESSAGE="${MESSAGE}🏷️ <b>Commit:</b> <code>${SHORT_SHA} - ${COMMIT_MSG}</code>%0A"
          MESSAGE="${MESSAGE}⚠️ <i>Build aplikasi atau Playwright E2E browser test mengalami kegagalan.</i>%0A"
          MESSAGE="${MESSAGE}👉 <a href=\"${RUN_URL}\">Lihat Log Error</a>"
          TOPIC_PARAM=""
          if [ -n "$TELEGRAM_DEV_TOPIC_ID" ]; then
            TOPIC_PARAM="-d message_thread_id=${TELEGRAM_DEV_TOPIC_ID}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_DEV_CHAT_ID}" $TOPIC_PARAM -d parse_mode="HTML" -d text="${MESSAGE}" -d disable_web_page_preview="true" || true
