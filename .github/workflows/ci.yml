name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    # Secret dummy khusus build-time. Secret asli dipakai di server/VPS,
    # bukan di CI. Tanpa ini Better Auth menolak di-import saat build.
    env:
      BETTER_AUTH_SECRET: ci-only-dummy-secret
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build
